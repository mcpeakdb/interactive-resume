<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danny McPeak Jr. — Lead Full Stack Developer</title>
    <meta
      name="description"
      content="Interactive resume for Danny McPeak Jr., Lead Full Stack Developer — Vue.js, GoLang, AWS and Docker."
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong one.
      ;(() => {
        const stored = localStorage.getItem('theme')
        const dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)

        // Same for motion, so the looping animations never get a frame to run
        // for someone who has asked for them to be held still.
        const motion = localStorage.getItem('motion')
        const still = motion
          ? motion === 'still'
          : window.matchMedia('(prefers-reduced-motion: reduce)').matches
        document.documentElement.classList.toggle('motion-still', still)

        // Same for the skin, so the palette is right on the first frame. The
        // allowlist keeps a stale or hand-edited value from stamping an
        // attribute no stylesheet answers to.
        const skins = ['racing', 'boba']
        const skin = localStorage.getItem('skin')
        document.documentElement.dataset.skin = skins.includes(skin) ? skin : skins[0]
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
